{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="text-center mb-4">
      <div class="eyebrow mb-2">Welcome back</div>
      <h2 class="mb-2">Pick up where you left off.</h2>
      <p class="text-muted mb-0">Sign in to browse local shops or manage your store.</p>
    </div>
    <div class="card">
      <div class="card-body">
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input class="form-control" type="email" name="email" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="password" required />
      </div>
      <button class="btn btn-primary w-100" type="submit">Login</button>
    </form>
      </div>
    </div>
    <p class="mt-3 text-center text-muted">
      No account? <a href="{{ url_for('signup') }}">Sign up here</a>.
    </p>
  </div>
</div>
{% endblock %}
