{% extends "base.html" %}
{% block content %}
<div class="page-heading">
  <div class="eyebrow mb-2">Inventory</div>
  <h2 class="mb-2">{% if mode == 'edit' %}Edit product{% else %}Add a product{% endif %}</h2>
  <p class="text-muted mb-0">Keep the details clear so customers know exactly what is available.</p>
</div>
<div class="card">
  <div class="card-body">
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Product name</label>
        <input class="form-control" type="text" name="name" value="{{ product.name if product else '' }}" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Price</label>
        <input class="form-control" type="text" name="price" value="{{ product.price if product else '' }}" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Stock available</label>
        <input class="form-control" type="number" name="stock" value="{{ product.stock if product else '' }}" required />
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">Save product</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('owner_dashboard') }}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
